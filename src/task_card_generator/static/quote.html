<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt Printer – Quote</title>
    <link rel="stylesheet" href="/static/css/common.css">
  </head>
  <body>
    <div class="wrap">
      <nav class="nav">
        <a href="/" class="nav-link">Task Card</a>
        <a href="/todolist" class="nav-link">Todolist</a>
        <a href="/quote" class="nav-link active">Quote</a>
      </nav>

      <h1>Print a Quote</h1>
      <p class="msg">Paste an upbeat quote (or fetch a random one) and print it with the poster-style layout.</p>

      <div id="printer-status" class="status-banner">
        <span class="status-dot"></span>
        <span class="status-text">Checking printer status...</span>
      </div>

      <form id="quote-form">
        <label>
          Quote
          <input type="text" name="quote" id="quote" required placeholder="e.g., Start small. Start now." />
        </label>
        <div class="row-split">
          <label>
            Author (optional)
            <input type="text" name="author" id="author" placeholder="e.g., James Clear" />
          </label>
          <label>
            Tagline (optional)
            <input type="text" name="tagline" id="tagline" placeholder="e.g., Tiny steps count." />
          </label>
        </div>

        <div style="display:flex; gap:0.5rem; flex-wrap: wrap;">
          <button type="button" class="btn-secondary" id="random-btn">Random quote</button>
          <button type="submit" id="submit-btn">Print Quote!</button>
        </div>
      </form>
    </div>

    <dialog id="result-dialog">
      <div class="dialog-content">
        <div class="dialog-header" id="dialog-header">
          <span class="dialog-icon" id="dialog-icon"></span>
          <h2 class="dialog-title" id="dialog-title"></h2>
        </div>
        <div class="dialog-body" id="dialog-body"></div>
      </div>
      <div class="dialog-footer">
        <button class="dialog-close" id="dialog-close">OK</button>
      </div>
    </dialog>

    <section class="history" aria-label="Recent prints">
      <h2>Recent prints</h2>
      <p class="history-note">Last 10 tickets stay in memory for quick reprint.</p>
      <div class="history-list" id="history-list"></div>
    </section>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/quote.js"></script>
  </body>
</html>
